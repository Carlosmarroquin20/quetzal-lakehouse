[project]
name = "quetzal-ingestion"
version = "0.1.0"
description = "Jobs that land public Guatemalan data in the bronze layer of the lakehouse."
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.113",
    "defusedxml>=0.7.1",
    "httpx>=0.28.1",
    "pyarrow>=26.0.0",
    "tzdata>=2026.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quetzal_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
