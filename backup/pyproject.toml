[project]
name = "quetzal-backup"
version = "0.1.0"
description = "Daily dumps of the DuckLake catalogs of the lakehouse."
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.118",
    "tzdata>=2026.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quetzal_backup"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
