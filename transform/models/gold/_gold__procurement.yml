version: 2

models:
  - name: dim_buyer
    description: >
      Public bodies that buy through Guatecompras, one row per buyer, with
      the most recent name the source gives it. A buyer is a body with its
      own tax number. Several buyers can belong to the same budget entity:
      for example, the secretariats of the Presidency are separate buyers
      that share one entity code.
    columns:
      - name: buyer_key
        data_type: varchar
        constraints:
          - type: not_null
        description: Surrogate key, a hash of buyer_id.
        data_tests:
          - not_null
          - unique
      - name: buyer_id
        data_type: varchar
        constraints:
          - type: not_null
        description: Tax number of the public body, prefixed with GT-NIT. The natural key.
        data_tests:
          - not_null
          - unique
      - name: buyer_name
        data_type: varchar
        constraints:
          - type: not_null
        description: Name of the buyer.
        data_tests:
          - not_null
      - name: entity_code
        data_type: varchar
        description: >
          Code of the budget entity the buyer belongs to, in the
          institutional classifier of the public sector. Empty for the
          buyers whose processes never list it.
      - name: entity_key
        data_type: varchar
        description: >
          Budget entity the buyer belongs to. Foreign key to dim_entity, which
          is how procurement is compared with the budget. Empty when
          entity_code is.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_entity')
                field: entity_key
      - name: entity_type
        data_type: varchar
        description: Kind of public body the budget entity is, in Spanish.
      - name: entity_sector
        data_type: varchar
        description: Sector the budget entity belongs to, in Spanish.

  - name: dim_supplier
    description: >
      Suppliers awarded at least one process, one row per supplier, with the
      most recent name the source gives it. Natural persons are not
      identified here: their tax number and name are replaced, and so are
      those of suppliers whose legal type is unknown. Silver keeps the
      original values for those allowed to see them.
    config:
      meta:
        personal_data: masked
    data_tests:
      - dbt_utils.expression_is_true:
          name: masked_suppliers_show_no_identity
          arguments:
            expression: "not is_masked or (supplier_id is null and supplier_name in ('Natural person', 'Supplier of unknown legal type'))"
    columns:
      - name: supplier_key
        data_type: varchar
        constraints:
          - type: not_null
        description: >
          Surrogate key, a keyed hash (HMAC-SHA256) of the supplier's
          identifier. Without the key it cannot be computed from a tax
          number, so it does not reveal who the supplier is.
        data_tests:
          - not_null
          - unique
      - name: supplier_id
        data_type: varchar
        description: >
          Tax number prefixed with GT-NIT, or a Guatecompras number prefixed
          with GT-GCID. Empty when the supplier is masked.
      - name: supplier_name
        data_type: varchar
        constraints:
          - type: not_null
        description: >
          Name of the supplier, or "Natural person" or "Supplier of unknown
          legal type" when it is masked.
        data_tests:
          - not_null
      - name: identifier_scheme
        data_type: varchar
        description: Registry that issued the identifier.
      - name: legal_type
        data_type: varchar
        description: Legal form of the supplier, in Spanish. Empty when the source does not give it.
      - name: is_natural_person
        data_type: boolean
        description: >
          True when the legal form is "INDIVIDUAL". Empty, not false, when
          the legal form is unknown.
      - name: is_masked
        data_type: boolean
        constraints:
          - type: not_null
        description: True when supplier_id and supplier_name are replaced.
        data_tests:
          - not_null

  - name: dim_procurement_method
    description: >
      Procedures under which purchases are made, one row per procedure of
      Guatemalan procurement law.
    columns:
      - name: procurement_method_key
        data_type: varchar
        constraints:
          - type: not_null
        description: Surrogate key, a hash of the procedure and its OCDS method.
        data_tests:
          - not_null
          - unique
      - name: procurement_procedure
        data_type: varchar
        constraints:
          - type: not_null
        description: Name of the procedure, in Spanish, with the article of the law that governs it.
        data_tests:
          - not_null
      - name: ocds_method
        data_type: varchar
        description: Method the source assigns to the procedure in the OCDS code list.

  - name: fct_awards
    description: >
      Awards made through Guatecompras. The grain is one row per award: a
      contracting process awarded, in whole or in part, to one supplier for
      an amount. Processes that were never awarded have no rows here.
      Cancelled awards are included and flagged with is_cancelled; amounts
      can be summed across any dimension, and a total that should only count
      valid awards must filter them out.
    data_tests:
      - dbt_utils.equal_rowcount:
          name: fct_awards_keeps_every_silver_award
          arguments:
            compare_model: ref('stg_guatecompras__awards')
    columns:
      - name: award_id
        data_type: varchar
        constraints:
          - type: not_null
        description: Identifier of the award in the source. One row per award.
        data_tests:
          - not_null
          - unique
      - name: ocid
        data_type: varchar
        constraints:
          - type: not_null
        description: Open contracting identifier of the process the award belongs to.
        data_tests:
          - not_null
      - name: tender_id
        data_type: varchar
        constraints:
          - type: not_null
        description: Identifier of the tender, built from its Guatecompras operation number (NOG).
        data_tests:
          - not_null
      - name: award_date_key
        data_type: integer
        constraints:
          - type: not_null
        description: Day in Guatemala on which the award was made. Foreign key to dim_date.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: published_date_key
        data_type: integer
        constraints:
          - type: not_null
        description: Day in Guatemala on which the tender was published. Foreign key to dim_date.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: buyer_key
        data_type: varchar
        constraints:
          - type: not_null
        description: Public body that made the purchase. Foreign key to dim_buyer.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_buyer')
                field: buyer_key
      - name: supplier_key
        data_type: varchar
        constraints:
          - type: not_null
        description: Supplier that received the award. Foreign key to dim_supplier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: supplier_key
      - name: procurement_method_key
        data_type: varchar
        constraints:
          - type: not_null
        description: Procedure under which the purchase was made. Foreign key to dim_procurement_method.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_procurement_method')
                field: procurement_method_key
      - name: currency_key
        data_type: varchar
        constraints:
          - type: not_null
        description: Currency in which the award was made. Foreign key to dim_currency.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_currency')
                field: currency_key
      - name: procurement_category
        data_type: varchar
        description: What was bought (goods, services or works). Empty on a small share of processes.
      - name: is_cancelled
        data_type: boolean
        constraints:
          - type: not_null
        description: True when the award was cancelled after being made.
        data_tests:
          - not_null
      - name: awarded_amount
        data_type: decimal(18,2)
        constraints:
          - type: not_null
        description: Amount awarded, in the currency of the award.
        data_tests:
          - not_null
      - name: awarded_amount_gtq
        data_type: decimal(18,2)
        constraints:
          - type: not_null
        description: Amount awarded, in quetzales.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: awarded_amount_usd
        data_type: decimal(18,2)
        constraints:
          - type: not_null
        description: >
          Amount awarded, in US dollars, converted with the reference rate of
          the day the award was made (fct_exchange_rates).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

unit_tests:
  - name: an_award_is_converted_with_the_rate_of_its_day
    description: >
      The amount in dollars uses the reference rate of the award's own day,
      and a cancelled award is kept and flagged.
    model: fct_awards
    given:
      - input: ref('stg_guatecompras__awards')
        # SQL with explicit types, so dbt does not need the upstream table
        # to exist to learn its columns: the test runs without a store.
        format: sql
        rows: |
          select 'A1' as award_id, 'P1' as ocid, 'active' as status, date '2026-09-01' as awarded_date, 770.00::decimal(18, 2) as amount, 'GTQ' as currency_code, 'S1' as supplier_id
          union all
          select 'A2', 'P1', 'cancelled', date '2026-09-02', 1000.00::decimal(18, 2), 'GTQ', 'S2'
      - input: ref('stg_guatecompras__processes')
        format: sql
        rows: |
          select 'P1' as ocid, 'T1' as tender_id, date '2026-08-31' as published_date, 'B1' as buyer_id, 'Example procedure' as procurement_method_details, 'open' as procurement_method, 'goods' as procurement_category
      - input: ref('fct_exchange_rates')
        format: sql
        rows: |
          select 20260901 as date_key, 'usd' as currency_key, 7.7000000::decimal(11, 7) as reference_rate
          union all select 20260902, 'usd', 8.0000000::decimal(11, 7)
          union all select 20260901, 'other', 1.0000000::decimal(11, 7)
      - input: ref('dim_currency')
        format: sql
        rows: |
          select 'usd' as currency_key, 'USD' as currency_code
          union all select 'other', 'XXX'
    expect:
      rows:
        - {award_id: A1, award_date_key: 20260901, published_date_key: 20260831, procurement_category: goods, is_cancelled: false, awarded_amount: 770.00, awarded_amount_gtq: 770.00, awarded_amount_usd: 100.00}
        - {award_id: A2, award_date_key: 20260902, published_date_key: 20260831, procurement_category: goods, is_cancelled: true, awarded_amount: 1000.00, awarded_amount_gtq: 1000.00, awarded_amount_usd: 125.00}

  - name: natural_persons_are_masked
    description: >
      A natural person and a supplier of unknown legal type lose their
      identifier and name; a company keeps them. The key is not checked
      because it depends on the secret.
    model: dim_supplier
    given:
      - input: ref('stg_guatecompras__suppliers')
        # SQL with explicit types, so dbt does not need the upstream table
        # to exist to learn its columns: the test runs without a store.
        format: sql
        rows: |
          select 'GT-NIT-1' as supplier_id, 'EXAMPLE COMPANY S.A.' as supplier_name, 'GT-NIT' as identifier_scheme, 'SOCIEDAD ANÓNIMA' as legal_type
          union all select 'GT-NIT-2', 'JANE EXAMPLE', 'GT-NIT', 'INDIVIDUAL'
          union all select 'GT-GCID-3', 'FOREIGN EXAMPLE', 'GT-GCID', null::varchar
    expect:
      rows:
        - {supplier_id: GT-NIT-1, supplier_name: EXAMPLE COMPANY S.A., is_natural_person: false, is_masked: false}
        - {supplier_id: null, supplier_name: Natural person, is_natural_person: true, is_masked: true}
        - {supplier_id: null, supplier_name: Supplier of unknown legal type, is_natural_person: null, is_masked: true}
