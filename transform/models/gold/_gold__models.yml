version: 2

models:
  - name: dim_date
    description: >
      Calendar dimension with one row per day, from 1989-01-01 to the end of
      the current year. It is shared by every fact table.
    data_tests:
      - dbt_utils.sequential_values:
          name: dim_date_has_no_missing_days
          arguments:
            column_name: date_day
            interval: 1
            datepart: day
    columns:
      - name: date_key
        data_type: integer
        constraints:
          - type: not_null
        description: Surrogate key, the date written as the integer YYYYMMDD.
        data_tests:
          - not_null
          - unique
      - name: date_day
        data_type: date
        constraints:
          - type: not_null
        description: The calendar day.
        data_tests:
          - not_null
          - unique
      - name: year
        data_type: integer
        description: Calendar year.
      - name: quarter
        data_type: integer
        description: Quarter of the year, 1 to 4.
      - name: month
        data_type: integer
        description: Month of the year, 1 to 12.
      - name: month_name
        data_type: varchar
        description: Name of the month in English.
      - name: day_of_month
        data_type: integer
        description: Day of the month, 1 to 31.
      - name: day_of_week
        data_type: integer
        description: ISO day of the week, 1 (Monday) to 7 (Sunday).
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
      - name: day_name
        data_type: varchar
        description: Name of the day in English.
      - name: is_weekend
        data_type: boolean
        description: True on Saturdays and Sundays. Public holidays are not marked.
      - name: first_day_of_month
        data_type: date
        description: First day of the month the day belongs to, for grouping by month.

  - name: dim_currency
    description: >
      Currency dimension, one row per currency known to the lakehouse.
    columns:
      - name: currency_key
        data_type: varchar
        constraints:
          - type: not_null
        description: Surrogate key, a hash of the ISO 4217 code.
        data_tests:
          - not_null
          - unique
      - name: currency_code
        data_type: varchar
        constraints:
          - type: not_null
        description: ISO 4217 code. The natural key.
        data_tests:
          - not_null
          - unique
      - name: currency_name
        data_type: varchar
        description: Name of the currency in English.

  - name: fct_exchange_rates
    description: >
      Daily exchange rate of each currency against the quetzal. The grain is
      one row per currency and calendar day, from the first to the last day
      the source published a rate. Days the source skipped are filled with the
      last rate published before them and flagged with is_published = false,
      so any other fact can convert an amount on its own date with a plain
      join. Rates are not additive: they can be averaged over time, never
      summed.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: fct_exchange_rates_one_row_per_day_and_currency
          arguments:
            combination_of_columns: [date_key, currency_key]
      - dbt_utils.expression_is_true:
          name: reference_rate_lies_between_buy_and_sell
          arguments:
            expression: "reference_rate between least(buy_rate, sell_rate) and greatest(buy_rate, sell_rate)"
      - dbt_utils.expression_is_true:
          name: published_days_carry_their_own_rate
          description: On a published day the rate used is the one published that day.
          arguments:
            expression: "strftime(rate_published_date, '%Y%m%d')::integer = date_key"
          config:
            where: "is_published"
    columns:
      - name: date_key
        data_type: integer
        constraints:
          - type: not_null
        description: Day the rate applies to. Foreign key to dim_date.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: currency_key
        data_type: varchar
        constraints:
          - type: not_null
        description: Currency being priced. Foreign key to dim_currency.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_currency')
                field: currency_key
      - name: buy_rate
        data_type: decimal(10,6)
        constraints:
          - type: not_null
        description: Buying rate, in quetzales per unit of the currency.
        data_tests:
          - not_null
      - name: sell_rate
        data_type: decimal(10,6)
        constraints:
          - type: not_null
        description: Selling rate, in quetzales per unit of the currency.
        data_tests:
          - not_null
      - name: reference_rate
        data_type: decimal(11,7)
        constraints:
          - type: not_null
        description: >
          Rate to use when converting amounts: the midpoint of the buying and
          selling rates, in quetzales per unit of the currency. Since
          2006-12-02 the source publishes one rate in both fields, so the
          midpoint is that published rate. Before that date it is a computed
          value.
        data_tests:
          - not_null
      - name: is_published
        data_type: boolean
        constraints:
          - type: not_null
        description: >
          True when the source published a rate for the day. False on the
          days it skipped, whose rates are carried over from the last
          published day.
        data_tests:
          - not_null
      - name: rate_published_date
        data_type: date
        constraints:
          - type: not_null
        description: >
          Day on which the rate in this row was published. Equal to the row's
          own day when is_published is true, and an earlier day otherwise.
        data_tests:
          - not_null

unit_tests:
  - name: skipped_days_take_the_last_published_rate
    description: >
      A calendar day without a published rate gets the rate of the last
      published day and is flagged, and the reference rate is the midpoint of
      buying and selling rates.
    model: fct_exchange_rates
    given:
      - input: ref('stg_banguat__exchange_rates')
        # SQL with explicit types, so dbt does not need the upstream table
        # to exist to learn its columns: the test runs without a store.
        format: sql
        rows: |
          select date '2000-04-01' as rate_date, 'USD' as currency_code, 7.711940::decimal(10, 6) as buy_rate, 7.721870::decimal(10, 6) as sell_rate
          union all
          select date '2000-04-03', 'USD', 7.711340::decimal(10, 6), 7.721381::decimal(10, 6)
      - input: ref('dim_date')
        format: sql
        rows: |
          select 20000401 as date_key, date '2000-04-01' as date_day
          union all select 20000402, date '2000-04-02'
          union all select 20000403, date '2000-04-03'
          union all select 20000404, date '2000-04-04'
      - input: ref('dim_currency')
        format: sql
        rows: |
          select 'usd-key' as currency_key, 'USD' as currency_code
    expect:
      rows:
        - date_key: 20000401
          currency_key: usd-key
          buy_rate: 7.711940
          sell_rate: 7.721870
          reference_rate: 7.7169050
          is_published: true
          rate_published_date: 2000-04-01
        - date_key: 20000402
          currency_key: usd-key
          buy_rate: 7.711940
          sell_rate: 7.721870
          reference_rate: 7.7169050
          is_published: false
          rate_published_date: 2000-04-01
        - date_key: 20000403
          currency_key: usd-key
          buy_rate: 7.711340
          sell_rate: 7.721381
          reference_rate: 7.7163605
          is_published: true
          rate_published_date: 2000-04-03
