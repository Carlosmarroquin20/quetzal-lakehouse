version: 2

# Who consumes gold. Declared here so the lineage graph runs from the sources
# to the analyses, and so a change to a model shows what it would affect.
exposures:
  - name: budget_and_procurement_by_entity
    label: Budget and procurement by entity
    type: analysis
    maturity: medium
    url: https://github.com/Carlosmarroquin20/quetzal-lakehouse/blob/main/docs/data-model.md#budget-execution-1
    description: >
      Accrued budget against valid awards, per budget entity and year, as in
      the example of the data model documentation. It is the analysis that
      the shared entity dimension exists for.
    depends_on:
      - ref('fct_budget_execution')
      - ref('fct_awards')
      - ref('dim_buyer')
      - ref('dim_entity')
      - ref('dim_date')
    owner:
      name: Carlosmarroquin20

  - name: awards_in_dollars
    label: Awards in dollars per year
    type: analysis
    maturity: medium
    url: https://github.com/Carlosmarroquin20/quetzal-lakehouse/blob/main/docs/data-model.md#awards
    description: >
      Valid awards per year in quetzales and in US dollars, converted with the
      exchange rate of the day of each award.
    depends_on:
      - ref('fct_awards')
      - ref('fct_exchange_rates')
      - ref('dim_date')
    owner:
      name: Carlosmarroquin20

  - name: quetzal_dashboard
    label: Quetzal lakehouse dashboard
    type: dashboard
    maturity: medium
    url: http://localhost:8501
    description: >
      Streamlit dashboard over prod gold (the `dashboard` service of the
      Compose stack), with three pages: awards per year, budget execution per
      entity next to its awards, and the exchange rate. It reads gold with a
      key pair that can only read the prod gold bucket, and shows natural
      persons only as a group. The tables it reads are the views listed in
      dashboard/src/quetzal_dashboard/gold.py.
    depends_on:
      - ref('fct_awards')
      - ref('fct_budget_execution')
      - ref('fct_exchange_rates')
      - ref('dim_date')
      - ref('dim_currency')
      - ref('dim_buyer')
      - ref('dim_supplier')
      - ref('dim_procurement_method')
      - ref('dim_entity')
    owner:
      name: Carlosmarroquin20

  - name: daily_digest
    label: Daily digest
    type: application
    maturity: medium
    url: https://github.com/Carlosmarroquin20/quetzal-lakehouse/tree/main/notifications
    description: >
      Summary of each daily run (the `notifications` job of the Compose
      stack): the latest dollar rate and its change, the valid awards of the
      previous day and of the year so far, the largest awards to legal
      entities, and the row counts of the fact tables. It leaves the
      lakehouse in notifications, so it reads gold with its own key pair that
      can only read the prod gold bucket, and shows natural persons only as
      a group. The tables it reads are the views listed in
      notifications/src/quetzal_notifications/gold.py.
    depends_on:
      - ref('fct_exchange_rates')
      - ref('fct_awards')
      - ref('fct_budget_execution')
      - ref('dim_date')
      - ref('dim_currency')
      - ref('dim_buyer')
      - ref('dim_supplier')
      - ref('dim_procurement_method')
    owner:
      name: Carlosmarroquin20
