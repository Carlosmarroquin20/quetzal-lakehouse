name: quetzal_lakehouse
version: "0.1.0"
profile: quetzal_lakehouse

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

flags:
  # Do not report usage statistics to dbt Labs.
  send_anonymous_usage_stats: false

# Each build starts from an empty gold.staging, and leaves a mark there only
# if every model and test passed; publish_gold requires the mark.
on-run-start:
  - "{{ clear_gold_staging() }}"
on-run-end:
  - "{{ mark_build_passed(results) }}"

models:
  quetzal_lakehouse:
    # Every model is a table of the DuckLake catalog of its layer, attached
    # in profiles.yml. The data is Parquet in the layer's bucket.
    +materialized: table
    silver:
      +database: silver
    # Gold is built and tested in a staging schema. Readers see gold.main,
    # which the publish_gold operation replaces in one transaction, and only
    # once the whole build has passed.
    gold:
      +database: gold
      +schema: staging
      # Gold is what the dashboard and the digest read, so its shape is a
      # contract: a model fails before writing anything unless it returns
      # exactly the columns and types its YAML declares. CI also fails when a
      # change removes or retypes a column of the previous commit.
      +contract:
        enforced: true
