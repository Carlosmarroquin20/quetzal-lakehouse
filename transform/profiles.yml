quetzal_lakehouse:
  # dev unless told otherwise: running dbt without choosing never reaches
  # prod. The two targets differ only in what their Compose services pass in:
  # buckets, the key pair of their role and the pseudonymization key.
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev: &duckdb
      type: duckdb
      # Scratch database. It only holds views over the Parquet files and the
      # seeds; deleting it loses nothing, because the next run rebuilds it.
      path: "{{ env_var('DBT_DUCKDB_PATH', 'quetzal.duckdb') }}"
      threads: 4
      settings:
        # Keep DuckDB below the memory of the container it runs in. Beyond
        # this it spills to disk instead of being killed.
        memory_limit: "{{ env_var('DBT_DUCKDB_MEMORY_LIMIT', '3GB') }}"
        # Lets large scans stream instead of buffering rows to keep their order.
        preserve_insertion_order: false
      extensions:
        - httpfs
      # Plugins run on every connection, before the attachments below:
      # s3_access creates the secret that reaches the object store,
      # catalog_access the one that logs in to the DuckLake catalog, both
      # from the environment; pseudonymization registers pseudonymize().
      module_paths:
        - plugins
      plugins:
        - module: s3_access
        - module: catalog_access
        - module: pseudonymization
      # Silver and gold as DuckLake catalogs: tables with versions, written in
      # transactions, whose Parquet files live in the bucket of each layer.
      # The catalogs themselves are databases of the `catalog` Postgres.
      # Without LAKE_CATALOG_HOST, as in CI, local throwaway catalogs under
      # target/ stand in, so dbt can still parse and run unit tests.
      attach:
        - alias: silver
          is_ducklake: true
          path: "{{ 'ducklake:postgres:dbname=' ~ env_var('LAKE_SILVER_CATALOG', '') if env_var('LAKE_CATALOG_HOST', '') else 'ducklake:target/silver.ducklake' }}"
          options:
            data_path: "{{ 's3://' ~ env_var('S3_BUCKET_SILVER') ~ '/ducklake/' if env_var('LAKE_CATALOG_HOST', '') else 'target/lake/silver/' }}"
        - alias: gold
          is_ducklake: true
          path: "{{ 'ducklake:postgres:dbname=' ~ env_var('LAKE_GOLD_CATALOG', '') if env_var('LAKE_CATALOG_HOST', '') else 'ducklake:target/gold.ducklake' }}"
          options:
            data_path: "{{ 's3://' ~ env_var('S3_BUCKET_GOLD') ~ '/ducklake/' if env_var('LAKE_CATALOG_HOST', '') else 'target/lake/gold/' }}"
    prod: *duckdb
