[project]
name = "quetzal-dashboard"
version = "0.1.0"
description = "Streamlit dashboard that reads the gold layer of the lakehouse."
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "streamlit>=1.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quetzal_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
