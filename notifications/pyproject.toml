[project]
name = "quetzal-notifications"
version = "0.1.0"
description = "Daily digest of the lakehouse, computed from the gold layer for notifications."
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "tzdata>=2026.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quetzal_notifications"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
