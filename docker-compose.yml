name: quetzal-lakehouse

services:
  storage:
    # S3-compatible object store for local development. The rest of the
    # project only depends on the S3 API, so in AWS this service is replaced
    # by S3 itself with no code changes.
    # The tag is pinned because the image's all-in-one defaults (ports,
    # bundled components) may change between releases.
    image: chrislusf/seaweedfs:4.48
    environment:
      # Mapped from project-specific names so that real AWS credentials
      # exported in the host shell are never picked up by accident.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      # Comma-separated list. Missing buckets are created on every start;
      # existing ones are left as they are.
      S3_BUCKET: "${S3_BUCKET_BRONZE:?set S3_BUCKET_BRONZE in .env},${S3_BUCKET_SILVER:?set S3_BUCKET_SILVER in .env}"
    ports:
      # Published on loopback only: reachable from this machine, not the LAN.
      - "127.0.0.1:8333:8333"
    volumes:
      - storage-data:/data
    healthcheck:
      # Unauthenticated liveness endpoint of the S3 gateway.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  ingestion:
    # A job, not a long-running service. The profile keeps `docker compose up`
    # from starting it; run it with `docker compose run --rm ingestion`.
    build: ./ingestion
    profiles: ["jobs"]
    environment:
      # Inside the Compose network the store is reached by its service name.
      S3_ENDPOINT_URL: http://storage:8333
      S3_REGION: ${S3_REGION:?set S3_REGION in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET_BRONZE: ${S3_BUCKET_BRONZE:?set S3_BUCKET_BRONZE in .env}
    depends_on:
      storage:
        condition: service_healthy

  transform:
    # dbt job. Without arguments it runs `dbt build`; anything after the
    # service name replaces that, e.g. `docker compose run --rm transform test`.
    build: ./transform
    profiles: ["jobs"]
    environment:
      S3_ENDPOINT_URL: http://storage:8333
      S3_REGION: ${S3_REGION:?set S3_REGION in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_BUCKET_BRONZE: ${S3_BUCKET_BRONZE:?set S3_BUCKET_BRONZE in .env}
      S3_BUCKET_SILVER: ${S3_BUCKET_SILVER:?set S3_BUCKET_SILVER in .env}
    depends_on:
      storage:
        condition: service_healthy

volumes:
  storage-data:
