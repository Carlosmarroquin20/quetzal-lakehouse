name: quetzal-lakehouse

# Every outside image is pinned by tag and digest. A tag can be moved to
# point at a different image; the digest cannot, so `docker compose pull`
# always gets the image that was reviewed. Dependabot updates both together.

x-airflow: &airflow
  image: apache/airflow:3.3.2@sha256:e9982ad3f49a60418622e1baf80c34b0daf3fa5091a336cb5ee61f0cdd189371
  profiles: ["airflow"]
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:?set AIRFLOW_DB_USER in .env}:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}@airflow-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?set AIRFLOW_API_SECRET_KEY in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Guatemala
    # A dbt build can starve the scheduler of CPU inside Docker's virtual
    # machine. With the default of 30 seconds without a heartbeat, Airflow
    # declared the scheduler dead mid-build and killed the dbt task.
    AIRFLOW__SCHEDULER__SCHEDULER_HEALTH_CHECK_THRESHOLD: "120"
    # Local development only: the interface is open without a login. It is
    # published on loopback, so only this machine can reach it.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # What the tasks pass on to the containers they start. Airflow runs the
    # prod environment, and each kind of task gets the key of its own role.
    S3_REGION: ${S3_REGION:?set S3_REGION in .env}
    S3_BUCKET_BRONZE: ${S3_BUCKET_BRONZE:?set S3_BUCKET_BRONZE in .env}
    S3_BUCKET_SILVER: ${S3_BUCKET_SILVER:?set S3_BUCKET_SILVER in .env}
    S3_BUCKET_GOLD: ${S3_BUCKET_GOLD:?set S3_BUCKET_GOLD in .env}
    S3_INGESTION_ACCESS_KEY_ID: ${S3_INGESTION_ACCESS_KEY_ID:?set S3_INGESTION_ACCESS_KEY_ID in .env}
    S3_INGESTION_SECRET_ACCESS_KEY: ${S3_INGESTION_SECRET_ACCESS_KEY:?set S3_INGESTION_SECRET_ACCESS_KEY in .env}
    S3_TRANSFORM_PROD_ACCESS_KEY_ID: ${S3_TRANSFORM_PROD_ACCESS_KEY_ID:?set S3_TRANSFORM_PROD_ACCESS_KEY_ID in .env}
    S3_TRANSFORM_PROD_SECRET_ACCESS_KEY: ${S3_TRANSFORM_PROD_SECRET_ACCESS_KEY:?set S3_TRANSFORM_PROD_SECRET_ACCESS_KEY in .env}
    PSEUDONYMIZATION_KEY_PROD: ${PSEUDONYMIZATION_KEY_PROD:?set PSEUDONYMIZATION_KEY_PROD in .env}
    S3_NOTIFICATIONS_ACCESS_KEY_ID: ${S3_NOTIFICATIONS_ACCESS_KEY_ID:?set S3_NOTIFICATIONS_ACCESS_KEY_ID in .env}
    S3_NOTIFICATIONS_SECRET_ACCESS_KEY: ${S3_NOTIFICATIONS_SECRET_ACCESS_KEY:?set S3_NOTIFICATIONS_SECRET_ACCESS_KEY in .env}
    # Optional: without a URL the digest task is skipped.
    NOTIFICATIONS_WEBHOOK_URL: ${NOTIFICATIONS_WEBHOOK_URL:-}
    NOTIFICATIONS_WEBHOOK_SECRET: ${NOTIFICATIONS_WEBHOOK_SECRET:-}
    # The Docker daemon resolves bind mounts on the host, so the landing
    # folder has to be given as a host path.
    PROJECT_HOST_DIR: ${PROJECT_HOST_DIR:?set PROJECT_HOST_DIR in .env}
  volumes:
    - ./orchestration/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs

# Shared by the dbt services; each one adds its environment's buckets, key
# pair and pseudonymization key.
x-dbt-common: &dbt-common
  S3_ENDPOINT_URL: http://storage:8333
  S3_REGION: ${S3_REGION:?set S3_REGION in .env}
  S3_BUCKET_BRONZE: ${S3_BUCKET_BRONZE:?set S3_BUCKET_BRONZE in .env}

services:
  storage:
    # S3-compatible object store for local development. The rest of the
    # project only depends on the S3 API, so in AWS this service is replaced
    # by S3 itself with no code changes.
    # The tag is pinned because the image's all-in-one defaults (ports,
    # bundled components) may change between releases.
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    environment:
      # The administrator key pair. Jobs do not use it: each role has its
      # own key pair, created by storage-init. Mapped from project-specific
      # names so that real AWS credentials exported in the host shell are
      # never picked up by accident.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      # Comma-separated list. Missing buckets are created on every start;
      # existing ones are left as they are. Bronze is shared; silver and gold
      # have one bucket per environment.
      S3_BUCKET: "${S3_BUCKET_BRONZE:?set S3_BUCKET_BRONZE in .env},${S3_BUCKET_SILVER:?set S3_BUCKET_SILVER in .env},${S3_BUCKET_GOLD:?set S3_BUCKET_GOLD in .env},${S3_BUCKET_SILVER_DEV:?set S3_BUCKET_SILVER_DEV in .env},${S3_BUCKET_GOLD_DEV:?set S3_BUCKET_GOLD_DEV in .env}"
    ports:
      # Published on loopback only: reachable from this machine, not the LAN.
      - "127.0.0.1:8333:8333"
    volumes:
      - storage-data:/data
    healthcheck:
      # Unauthenticated liveness endpoint of the S3 gateway.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  catalog:
    # The DuckLake catalogs of silver and gold: which Parquet files make up
    # each version of each table. The data itself stays in the buckets. Like
    # the store, it runs without a profile, because every dbt run and every
    # reader of gold needs it.
    image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    environment:
      POSTGRES_USER: ${LAKE_CATALOG_ADMIN_USER:?set LAKE_CATALOG_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${LAKE_CATALOG_ADMIN_PASSWORD:?set LAKE_CATALOG_ADMIN_PASSWORD in .env}
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${LAKE_CATALOG_ADMIN_USER}", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-init:
    # Creates the catalogs and one login per role, each allowed only what its
    # role needs. Runs on every start and ends; applying it again changes
    # nothing, and keeps the passwords in step with .env.
    image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    entrypoint: ["sh", "/init-catalog.sh"]
    environment:
      POSTGRES_USER: ${LAKE_CATALOG_ADMIN_USER:?set LAKE_CATALOG_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${LAKE_CATALOG_ADMIN_PASSWORD:?set LAKE_CATALOG_ADMIN_PASSWORD in .env}
      LAKE_CATALOG_PROD_PASSWORD: ${LAKE_CATALOG_PROD_PASSWORD:?set LAKE_CATALOG_PROD_PASSWORD in .env}
      LAKE_CATALOG_DEV_PASSWORD: ${LAKE_CATALOG_DEV_PASSWORD:?set LAKE_CATALOG_DEV_PASSWORD in .env}
      LAKE_CATALOG_DASHBOARD_PASSWORD: ${LAKE_CATALOG_DASHBOARD_PASSWORD:?set LAKE_CATALOG_DASHBOARD_PASSWORD in .env}
      LAKE_CATALOG_NOTIFICATIONS_PASSWORD: ${LAKE_CATALOG_NOTIFICATIONS_PASSWORD:?set LAKE_CATALOG_NOTIFICATIONS_PASSWORD in .env}
    volumes:
      - ./catalog/init-catalog.sh:/init-catalog.sh:ro
    depends_on:
      catalog:
        condition: service_healthy

  storage-init:
    # Creates one identity per role, each allowed only what its role needs.
    # Runs on every start and ends; applying the same identities again
    # changes nothing.
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        # weed shell echoes the whole configuration, secret keys included, so
        # its output is discarded.
        weed shell -master=storage:9333 > /dev/null <<EOF
        s3.configure -user=ingestion -access_key=$$INGESTION_KEY -secret_key=$$INGESTION_SECRET -buckets=$$BRONZE -actions=Read,Write,List -apply
        s3.configure -user=transform-prod -access_key=$$PROD_KEY -secret_key=$$PROD_SECRET -buckets=$$BRONZE -actions=Read,List -apply
        s3.configure -user=transform-prod -buckets=$$SILVER,$$GOLD -actions=Read,Write,List -apply
        s3.configure -user=transform-dev -access_key=$$DEV_KEY -secret_key=$$DEV_SECRET -buckets=$$BRONZE -actions=Read,List -apply
        s3.configure -user=transform-dev -buckets=$$SILVER_DEV,$$GOLD_DEV -actions=Read,Write,List -apply
        s3.configure -user=dashboard -access_key=$$DASHBOARD_KEY -secret_key=$$DASHBOARD_SECRET -buckets=$$GOLD -actions=Read,List -apply
        s3.configure -user=notifications -access_key=$$NOTIFICATIONS_KEY -secret_key=$$NOTIFICATIONS_SECRET -buckets=$$GOLD -actions=Read,List -apply
        EOF
        echo "identities applied: ingestion, transform-prod, transform-dev, dashboard, notifications"
    environment:
      BRONZE: ${S3_BUCKET_BRONZE}
      SILVER: ${S3_BUCKET_SILVER}
      GOLD: ${S3_BUCKET_GOLD}
      SILVER_DEV: ${S3_BUCKET_SILVER_DEV}
      GOLD_DEV: ${S3_BUCKET_GOLD_DEV}
      INGESTION_KEY: ${S3_INGESTION_ACCESS_KEY_ID:?set S3_INGESTION_ACCESS_KEY_ID in .env}
      INGESTION_SECRET: ${S3_INGESTION_SECRET_ACCESS_KEY:?set S3_INGESTION_SECRET_ACCESS_KEY in .env}
      PROD_KEY: ${S3_TRANSFORM_PROD_ACCESS_KEY_ID:?set S3_TRANSFORM_PROD_ACCESS_KEY_ID in .env}
      PROD_SECRET: ${S3_TRANSFORM_PROD_SECRET_ACCESS_KEY:?set S3_TRANSFORM_PROD_SECRET_ACCESS_KEY in .env}
      DEV_KEY: ${S3_TRANSFORM_DEV_ACCESS_KEY_ID:?set S3_TRANSFORM_DEV_ACCESS_KEY_ID in .env}
      DEV_SECRET: ${S3_TRANSFORM_DEV_SECRET_ACCESS_KEY:?set S3_TRANSFORM_DEV_SECRET_ACCESS_KEY in .env}
      DASHBOARD_KEY: ${S3_DASHBOARD_ACCESS_KEY_ID:?set S3_DASHBOARD_ACCESS_KEY_ID in .env}
      DASHBOARD_SECRET: ${S3_DASHBOARD_SECRET_ACCESS_KEY:?set S3_DASHBOARD_SECRET_ACCESS_KEY in .env}
      NOTIFICATIONS_KEY: ${S3_NOTIFICATIONS_ACCESS_KEY_ID:?set S3_NOTIFICATIONS_ACCESS_KEY_ID in .env}
      NOTIFICATIONS_SECRET: ${S3_NOTIFICATIONS_SECRET_ACCESS_KEY:?set S3_NOTIFICATIONS_SECRET_ACCESS_KEY in .env}
    depends_on:
      storage:
        condition: service_healthy

  ingestion:
    # Jobs, not a long-running service. The profile keeps `docker compose up`
    # from starting it; run one with `docker compose run --rm ingestion <job>`,
    # for example `exchange-rates`. The image name is fixed because Airflow
    # starts the same image for its tasks.
    build: ./ingestion
    image: quetzal-lakehouse-ingestion
    profiles: ["jobs"]
    environment:
      # Inside the Compose network the store is reached by its service name.
      S3_ENDPOINT_URL: http://storage:8333
      S3_REGION: ${S3_REGION:?set S3_REGION in .env}
      # The ingestion role: it can write bronze and nothing else.
      S3_ACCESS_KEY_ID: ${S3_INGESTION_ACCESS_KEY_ID:?set S3_INGESTION_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_INGESTION_SECRET_ACCESS_KEY:?set S3_INGESTION_SECRET_ACCESS_KEY in .env}
      S3_BUCKET_BRONZE: ${S3_BUCKET_BRONZE:?set S3_BUCKET_BRONZE in .env}
    volumes:
      # Files downloaded by hand, for sources that cannot be fetched by a
      # job. Read-only: a job loads them but never changes or deletes them.
      - ./landing:/landing:ro
    depends_on: &after-storage-init
      storage-init:
        condition: service_completed_successfully
      catalog-init:
        condition: service_completed_successfully

  transform:
    # dbt in the prod environment, the one Airflow runs and gold consumers
    # read. Without arguments it runs `dbt build`; anything after the service
    # name replaces that, e.g. `docker compose run --rm transform test`.
    build: ./transform
    image: quetzal-lakehouse-transform
    profiles: ["jobs"]
    environment: &dbt-prod-environment
      <<: *dbt-common
      DBT_TARGET: prod
      S3_BUCKET_SILVER: ${S3_BUCKET_SILVER:?set S3_BUCKET_SILVER in .env}
      S3_BUCKET_GOLD: ${S3_BUCKET_GOLD:?set S3_BUCKET_GOLD in .env}
      S3_ACCESS_KEY_ID: ${S3_TRANSFORM_PROD_ACCESS_KEY_ID:?set S3_TRANSFORM_PROD_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_TRANSFORM_PROD_SECRET_ACCESS_KEY:?set S3_TRANSFORM_PROD_SECRET_ACCESS_KEY in .env}
      PSEUDONYMIZATION_KEY: ${PSEUDONYMIZATION_KEY_PROD:?set PSEUDONYMIZATION_KEY_PROD in .env}
    volumes:
      # DuckDB scratch database: views over the Parquet files and the seeds.
      # Kept between runs so that separate dbt commands see each other's
      # results. It holds no data of its own and can be deleted at any time.
      - transform-state:/app/state
    depends_on: *after-storage-init

  transform-dev:
    # dbt in the dev environment, for trying changes. It reads the same
    # bronze but writes its own silver and gold buckets, with a key pair that
    # cannot touch prod.
    build: ./transform
    image: quetzal-lakehouse-transform
    profiles: ["jobs"]
    environment:
      <<: *dbt-common
      DBT_TARGET: dev
      S3_BUCKET_SILVER: ${S3_BUCKET_SILVER_DEV:?set S3_BUCKET_SILVER_DEV in .env}
      S3_BUCKET_GOLD: ${S3_BUCKET_GOLD_DEV:?set S3_BUCKET_GOLD_DEV in .env}
      S3_ACCESS_KEY_ID: ${S3_TRANSFORM_DEV_ACCESS_KEY_ID:?set S3_TRANSFORM_DEV_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_TRANSFORM_DEV_SECRET_ACCESS_KEY:?set S3_TRANSFORM_DEV_SECRET_ACCESS_KEY in .env}
      PSEUDONYMIZATION_KEY: ${PSEUDONYMIZATION_KEY_DEV:?set PSEUDONYMIZATION_KEY_DEV in .env}
    volumes:
      - transform-state-dev:/app/state
    depends_on: *after-storage-init

  docs:
    # dbt documentation site of the prod environment, with the lineage graph,
    # at http://localhost:8080. It describes what the last prod run built, so
    # run that job first.
    build: ./transform
    image: quetzal-lakehouse-transform
    profiles: ["docs"]
    entrypoint: ["sh", "-c"]
    command: ["dbt docs generate && exec dbt docs serve --host 0.0.0.0 --port 8080 --no-browser"]
    environment: *dbt-prod-environment
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - transform-state:/app/state
    depends_on: *after-storage-init

  dashboard:
    # Streamlit dashboard over prod gold, at http://localhost:8501. It reads
    # the Parquet files on every query (results are cached for an hour), so
    # it shows what the last prod dbt build wrote.
    build: ./dashboard
    image: quetzal-lakehouse-dashboard
    profiles: ["dashboard"]
    environment:
      S3_ENDPOINT_URL: http://storage:8333
      S3_REGION: ${S3_REGION:?set S3_REGION in .env}
      S3_BUCKET_GOLD: ${S3_BUCKET_GOLD:?set S3_BUCKET_GOLD in .env}
      # The dashboard role: it can read prod gold and nothing else.
      S3_ACCESS_KEY_ID: ${S3_DASHBOARD_ACCESS_KEY_ID:?set S3_DASHBOARD_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_DASHBOARD_SECRET_ACCESS_KEY:?set S3_DASHBOARD_SECRET_ACCESS_KEY in .env}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on: *after-storage-init

  notifications:
    # Jobs about notifications. `docker compose run --rm notifications digest`
    # prints the digest of prod gold as JSON; with `--post` it also sends it
    # to n8n. The image name is fixed because Airflow starts the same image
    # for its tasks.
    build: ./notifications
    image: quetzal-lakehouse-notifications
    profiles: ["jobs"]
    environment:
      S3_ENDPOINT_URL: http://storage:8333
      S3_REGION: ${S3_REGION:?set S3_REGION in .env}
      S3_BUCKET_GOLD: ${S3_BUCKET_GOLD:?set S3_BUCKET_GOLD in .env}
      # The notifications role: it can read prod gold and nothing else.
      S3_ACCESS_KEY_ID: ${S3_NOTIFICATIONS_ACCESS_KEY_ID:?set S3_NOTIFICATIONS_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_NOTIFICATIONS_SECRET_ACCESS_KEY:?set S3_NOTIFICATIONS_SECRET_ACCESS_KEY in .env}
      # Optional: without a URL, `--post` ends without sending anything.
      NOTIFICATIONS_WEBHOOK_URL: ${NOTIFICATIONS_WEBHOOK_URL:-}
      NOTIFICATIONS_WEBHOOK_SECRET: ${NOTIFICATIONS_WEBHOOK_SECRET:-}
    depends_on: *after-storage-init

  # A local emulator of the AWS APIs, to try the Terraform configuration in
  # infra/aws and the jobs against it without an AWS account. Start it with
  # `docker compose --profile aws up -d aws-emulator`; see docs/aws.md.
  aws-emulator:
    image: motoserver/moto:5.2.4@sha256:120b1589c6df7e35d2092935f6ff724486bb2c4189d0e36ce795baba1400ffd2
    profiles: ["aws"]
    networks:
      default:
        aliases:
          # The AWS provider reaches bucket tags through S3 Control, at a
          # hostname prefixed with the account ID: 123456789012 is the
          # emulator's account.
          - 123456789012.aws-emulator
    ports:
      # Published on loopback only, for checks from this machine.
      - "127.0.0.1:5000:5000"

  terraform:
    # Terraform without installing it: `docker compose --profile aws run
    # --rm terraform <command>`. It talks to the emulator, with the dummy
    # credentials the emulator accepts; nothing reaches AWS.
    image: hashicorp/terraform:1.16.6@sha256:bfffc1ded5fbf0a17beaaf22eb4793980abdb19d0761ff6a3a0efb2ab4d9b316
    profiles: ["aws"]
    working_dir: /infra
    environment:
      AWS_ENDPOINT_URL: http://aws-emulator:5000
      AWS_ACCESS_KEY_ID: emulator
      AWS_SECRET_ACCESS_KEY: emulator
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "1"
    volumes:
      - ./infra/aws:/infra
    depends_on:
      - aws-emulator

  # Airflow runs the pipeline every day. It only schedules: each task starts
  # the ingestion or transform image as a container, through the Docker
  # socket. Start it with `docker compose --profile airflow up -d`.
  airflow-db:
    image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:?set AIRFLOW_DB_USER in .env}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER}", "-d", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    # Creates or upgrades Airflow's own tables, then exits.
    <<: *airflow
    command: ["airflow", "db", "migrate"]
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-apiserver:
    # Web interface and API, at http://localhost:8081.
    <<: *airflow
    command: ["airflow", "api-server"]
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on: &after-init
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow
    command: ["airflow", "dag-processor"]
    depends_on: *after-init

  airflow-scheduler:
    # With the local executor, tasks run inside the scheduler, so this is the
    # container that starts the job containers. It does not mount the Docker
    # socket: it reaches Docker only through docker-proxy, on a network the
    # two of them share with nothing else.
    <<: *airflow
    command: ["airflow", "scheduler"]
    networks: [default, docker-api]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_started

  docker-proxy:
    # The only container with the Docker socket, mounted read-only. It lets
    # through the calls the DockerOperator makes (version, the image check,
    # and creating, starting, waiting for, reading the logs of and removing
    # containers) and refuses the rest: exec into other containers, builds,
    # volumes, networks, system calls. It cannot stop a task from creating a
    # container that mounts the host, so it narrows what Airflow can do
    # without making it safe to run untrusted DAGs.
    image: lscr.io/linuxserver/socket-proxy:3.4.6-r0-ls101@sha256:362cadf55b3c7920189347d0f4d60b389e2f80e929581bf10793f2371aab41e5
    profiles: ["airflow"]
    environment:
      VERSION: "1"
      PING: "1"
      IMAGES: "1"
      CONTAINERS: "1"
      POST: "1"
      ALLOW_START: "1"
      EVENTS: "0"
      EXEC: "0"
      BUILD: "0"
      VOLUMES: "0"
      NETWORKS: "0"
      SYSTEM: "0"
      INFO: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    read_only: true
    tmpfs:
      - /run

  n8n:
    # Routes and formats notifications, at http://localhost:5678. It moves no
    # data: Airflow runs the pipeline and posts what happened to n8n's
    # webhooks. Start it with `docker compose --profile notifications up -d`.
    # The tag is pinned because n8n releases often, and an upgrade can change
    # how stored workflows behave.
    image: n8nio/n8n:2.44.2@sha256:b57e7a9c8e5ab1a8fe9b03fff3158052aec65f571ed1f759897a20f306ad329d
    profiles: ["notifications"]
    environment:
      # Encrypts the credentials n8n stores, such as the bot token. Given here
      # rather than generated into the volume, so the key is kept with the
      # other secrets in .env instead of next to what it protects.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      GENERIC_TIMEZONE: America/Guatemala
      TZ: America/Guatemala
      # No usage statistics, no checks for new versions and no template
      # gallery: n8n contacts only the services a workflow sends to.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      # The workflows read the settings below from the environment, which n8n
      # blocks by default. Allowing it lets any workflow read every variable
      # of this container, the encryption key included; here the only person
      # who can edit workflows is the one who already holds .env.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Who receives the messages and when the digest raises an alert. Optional
      # here so that the stack starts without them; the workflows refuse to
      # run while one is missing.
      NOTIFICATIONS_TELEGRAM_CHAT_ID: ${NOTIFICATIONS_TELEGRAM_CHAT_ID:-}
      NOTIFICATIONS_EMAIL_FROM: ${NOTIFICATIONS_EMAIL_FROM:-}
      NOTIFICATIONS_EMAIL_TO: ${NOTIFICATIONS_EMAIL_TO:-}
      NOTIFICATIONS_RATE_CHANGE_ALERT_PERCENT: ${NOTIFICATIONS_RATE_CHANGE_ALERT_PERCENT:-}
      NOTIFICATIONS_AWARD_ALERT_GTQ: ${NOTIFICATIONS_AWARD_ALERT_GTQ:-}
      # Where failure alerts link to: Airflow as published on this machine.
      NOTIFICATIONS_AIRFLOW_URL: http://localhost:8081
    ports:
      # Published on loopback only, like the other interfaces.
      - "127.0.0.1:5678:5678"
    volumes:
      # Workflows, credentials and execution history, in n8n's own SQLite
      # database.
      - n8n-data:/home/node/.n8n
      # The versioned workflows and the script that imports them. Read-only:
      # n8n keeps its working copy in its database.
      - ./automation/n8n:/automation:ro
    healthcheck:
      # The image has wget but not curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  storage-data:
  catalog-data:
  transform-state:
  transform-state-dev:
  airflow-db-data:
  airflow-logs:
  n8n-data:

networks:
  default:
  # Only the Airflow scheduler and docker-proxy are on it, so no other
  # container can ask the proxy for anything. Internal: it has no way out.
  docker-api:
    internal: true
